# The procedures Price Check covers (/prices/). One entry per procedure.
#
# scripts/fetch_procedure_prices.py reads this list, looks every `code` up in Medicare's public data
# and writes data_sources/procedure-prices.json, which the page is built from. To add a procedure,
# add an entry here and run the script; it prints Medicare's own description of each code so you can
# check the code means what the entry says.
#
#   id          the #anchor and ?p= value in links; lowercase, hyphens, never reused
#   name        what a patient would call it
#   aka         other words people search for (medical name, misspellings, the condition it treats)
#   specialty   the group it is listed under
#   code        the billing code (HCPCS/CPT) of the main procedure, one side / one lesion / first unit
#   about       one plain sentence on what it is
#   anesthesia  optional: the anesthesia billing code used when an anesthesia provider takes part
#   note        optional: something the estimate does not include, said plainly
#   retired     optional table {ask, note}, for a code that is no longer in force (the script says when one
#               isn't in this year's fee schedule): `note` says what replaced it, and `ask` is how to name
#               the procedure on the phone instead of quoting the dead code ("a prostate biopsy")
#   cosmetic    optional table {fee, quote, excludes, source, url}: a published average for the cosmetic
#               (never insured) version of the procedure, shown beside the estimate. `quote` and
#               `excludes` are the source's own words, copied exactly; the page shows them in quotation marks
#
# Names, descriptions and search words here are written for this site. Medicare's descriptions come
# from its data files.

# The groups, and who does the procedures in each. Every procedure's `specialty` must be a `name` here.
#
#   name     the group's heading in the list
#   doctor   the kind of doctor, as a short label ("Dermatologist"): shown beside the heading and as a
#            button under the search box
#   doctors  the same in the plural, as it reads mid-sentence ("What dermatologists commonly do")
#   aka      words people search for when they mean this kind of doctor; searching any of them lists the
#            whole group. The first one is what the button searches for.

[[specialty]]
name = "Eyes"
doctor = "Eye doctor"
doctors = "eye doctors (ophthalmologists)"
aka = ["eye doctor", "ophthalmologist", "ophthalmology", "eye surgeon", "eye specialist", "oculoplastic surgeon", "retina specialist"]

